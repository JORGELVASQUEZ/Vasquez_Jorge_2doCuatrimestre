<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejemplo 3</title>
</head>
<body>
    <h1> ejemplo 3: crea un programa que reciba el nombre de usuario, su edad, estatura y su peso.  El programa debera calcular su IMC, mostrarlo al usuario y indicar si su peso es normal, bajo, sobrepeso, etc.</h1>
    <h2>Ingrese su nombre de usuario, edad, estatura y peso:</h2>
    <form action="ejemplo 3.php" method="GET">
        <label for="nombre">Nombre de usuario:</label>
        <input type="text" id="nombre" name="nombre"><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"><br>

        <label for="estatura">Estatura (en metros):</label>
        <input type="number" step="0.01" id="estatura" name="estatura"><br>

        <label for="peso">Peso (en kg):</label>
        <input type="number" step="0.1" id="peso" name="peso"><br>

        <input type="submit" value="Calcular IMC">
    </form>
</body>
</html>
